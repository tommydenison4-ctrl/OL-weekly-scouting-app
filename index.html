<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cameron Blankenship | OL Weekly Scouting</title></head><body style="background:#070b12;color:#fff;font-family:system-ui"><p id="boot">Loading OL Weekly Scouting…</p><script src="louisiana-tech-layout.js"></script><script>
(async()=>{try{const r=await fetch('./app-base.html');if(!r.ok)throw Error('Base app '+r.status);let html=await r.text();for(const [from,to] of window.OL_WEEK_PATCHES){if(!html.includes(from))throw Error('Weekly layout patch mismatch');html=html.replace(from,to)}document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='Unable to load OL scout: '+e.message}})();
</script></body></html>
